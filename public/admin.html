<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motinder Admin</title><style>body{font-family:Inter,Arial,sans-serif;background:#f8f7fb;color:#18152b;margin:0}.bar{background:#18122b;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.stat,.panel{background:#fff;border:1px solid #e9e5f1;border-radius:18px;padding:20px;box-shadow:0 8px 25px #2a174208}.stat b{display:block;font-size:30px;margin-top:8px}.panel{margin-top:20px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{border:1px solid #e4deef;background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.tabs button.active{background:#7c3aed;color:#fff}.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.row .grow{flex:1}.pill{padding:5px 9px;border-radius:99px;background:#f0eaff;color:#6733c6;font-size:12px}.danger{color:#d62f58}.actions button{margin:2px;padding:7px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}.login{max-width:400px;margin:12vh auto;background:#fff;padding:30px;border-radius:20px;border:1px solid #e8e3ef}.login input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.primary{width:100%;padding:12px;background:#7c3aed;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="app"></div><script>
let token=localStorage.motinderAdminToken||'';const api=location.origin.replace(/\\/$/,'');
const el=s=>document.querySelector(s);function html(s){el('#app').innerHTML=s}
async function req(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(api+path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){html('<div class="login"><h1>Motinder Admin</h1><p>Administrator access</p><input id="e" value="admin@motinder.local"><input id="p" type="password" value="ChangeMe123!"><button class="primary" onclick="doLogin()">Sign in</button></div>')}
async function doLogin(){try{const r=await fetch(api+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('#e').value,password:el('#p').value})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.accessToken;localStorage.motinderAdminToken=token;dashboard()}catch(e){alert(e.message)}}
async function dashboard(){try{const s=await req('/api/admin/stats');const reports=await req('/api/admin/reports');const users=await req('/api/admin/users');html('<div class="bar"><b>♥ Motinder Admin</b><button onclick="localStorage.removeItem(\'motinderAdminToken\');location.reload()">Log out</button></div><div class="wrap"><div class="grid">'+[['Users',s.users],['Active',s.active],['Open reports',s.openReports],['Pending photos',s.pendingPhotos],['Premium',s.activeSubscriptions]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="tabs"><button class="active">Reports</button><button onclick="loadUsers()">Users</button></div><div class="panel"><h2>Open reports</h2><div>'+reports.map(r=>'<div class="row"><div class="grow"><b>'+r.reported.firstName+'</b> <span class="pill">'+r.reason+'</span><br><small>'+((r.details||'No details'))+'</small></div><div class="actions"><button onclick="resolve(\''+r.id+'\',\'dismiss\')">Dismiss</button><button class="danger" onclick="resolve(\''+r.id+'\',\'ban\')">Ban user</button></div></div>').join('')+'</div></div></div>')}catch(e){localStorage.removeItem('motinderAdminToken');login()}}
async function loadUsers(){const users=await req('/api/admin/users');el('.panel').innerHTML='<h2>Users</h2>'+users.map(u=>'<div class="row"><div class="grow"><b>'+u.firstName+' '+(u.lastName||'')+'</b><br><small>'+(u.emailVerified?'Email verified':'Email not verified')+'</small></div><span class="pill">'+u.country+'</span></div>').join('')}
async function resolve(id,action){await req('/api/admin/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({action})});dashboard()}
if(token)dashboard();else login();
</script></body></html>
